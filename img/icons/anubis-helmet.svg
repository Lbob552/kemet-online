<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1d24"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7A1E"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#8B6508"/>
      <stop offset="100%" stop-color="#4A3500"/>
    </linearGradient>

    <!-- Obsidian Gradients -->
    <linearGradient id="obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C35"/>
      <stop offset="50%" stop-color="#15151A"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#008B8B"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Icon Base -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldLight)" stroke-width="8"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.4"/>

  <!-- Helmet Group -->
  <g filter="url(#goldShadow)">
    
    <!-- EARS -->
    <!-- Left Ear Outer -->
    <path d="M 160 210 L 90 40 C 130 50, 160 90, 195 180 Z" fill="url(#obsidian)" stroke="url(#goldLight)" stroke-width="4"/>
    <!-- Left Ear Inner -->
    <path d="M 150 190 L 105 65 C 130 75, 150 110, 175 170 Z" fill="url(#goldDark)"/>
    <path d="M 140 170 L 115 85 C 130 95, 145 120, 160 160 Z" fill="url(#cyanGlow)" opacity="0.8"/>

    <!-- Right Ear Outer -->
    <path d="M 352 210 L 422 40 C 382 50, 352 90, 317 180 Z" fill="url(#obsidian)" stroke="url(#goldLight)" stroke-width="4"/>
    <!-- Right Ear Inner -->
    <path d="M 362 190 L 407 65 C 382 75, 362 110, 337 170 Z" fill="url(#goldDark)"/>
    <path d="M 372 170 L 397 85 C 382 95, 367 120, 352 160 Z" fill="url(#cyanGlow)" opacity="0.8"/>

    <!-- MAIN HEAD STRUCTURE -->
    <!-- Skull/Crown Base -->
    <path d="M 170 190 C 170 120, 342 120, 342 190 L 360 270 L 152 270 Z" fill="url(#obsidian)"/>
    
    <!-- Nemes Headdress Side Flaps -->
    <path d="M 160 240 L 110 330 L 155 350 L 175 280 Z" fill="url(#goldLight)"/>
    <path d="M 150 250 L 120 315 L 145 330 L 165 280 Z" fill="url(#cyanGlow)"/>
    
    <path d="M 352 240 L 402 330 L 357 350 L 337 280 Z" fill="url(#goldLight)"/>
    <path d="M 362 250 L 392 315 L 367 330 L 347 280 Z" fill="url(#cyanGlow)"/>

    <!-- SNOUT AND MUZZLE -->
    <!-- Snout Bridge -->
    <polygon points="216,190 296,190 310,320 202,320" fill="url(#obsidian)" stroke="url(#goldLight)" stroke-width="3"/>
    <!-- Center Nose Ridge -->
    <path d="M 256 160 L 270 320 L 256 370 L 242 320 Z" fill="url(#goldLight)"/>

    <!-- Lower Muzzle / Jaw -->
    <path d="M 202 320 L 256 420 L 310 320 L 280 370 L 232 370 Z" fill="url(#obsidian)" stroke="url(#goldDark)" stroke-width="2"/>
    
    <!-- Golden Nose Tip -->
    <path d="M 242 350 L 270 350 L 256 375 Z" fill="url(#goldLight)"/>

    <!-- CHEEK GUARDS -->
    <path d="M 175 270 L 210 330 L 185 380 L 155 310 Z" fill="url(#goldDark)" stroke="url(#goldLight)" stroke-width="2"/>
    <path d="M 337 270 L 302 330 L 327 380 L 357 310 Z" fill="url(#goldDark)" stroke="url(#goldLight)" stroke-width="2"/>

    <!-- FOREHEAD CREST / DIADEM -->
    <path d="M 200 180 L 256 130 L 312 180 L 256 200 Z" fill="url(#goldLight)"/>
    <!-- Crest Gem -->
    <polygon points="256,150 268,170 256,190 244,170" fill="url(#cyanGlow)"/>

    <!-- GLOWING CYAN EYES (Anubis Vision) -->
    <!-- Left Eye -->
    <polygon points="190,235 230,245 198,255" fill="url(#cyanGlow)" filter="url(#eyeGlow)"/>
    <polygon points="190,235 230,245 198,255" fill="#FFFFFF"/>
    
    <!-- Right Eye -->
    <polygon points="322,235 282,245 314,255" fill="url(#cyanGlow)" filter="url(#eyeGlow)"/>
    <polygon points="322,235 282,245 314,255" fill="#FFFFFF"/>

    <!-- Brow Accents -->
    <path d="M 185 228 L 235 240" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 327 228 L 277 240" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round"/>

    <!-- NECK GUARD / COLLAR BASE -->
    <path d="M 190 390 L 256 460 L 322 390 L 290 440 L 222 440 Z" fill="url(#goldLight)"/>
    <path d="M 210 405 L 256 440 L 302 405" fill="none" stroke="url(#obsidian)" stroke-width="4"/>

    <!-- Hieroglyphic/Line Accents on Snout -->
    <line x1="230" y1="270" x2="230" y2="300" stroke="url(#goldDark)" stroke-width="2"/>
    <line x1="282" y1="270" x2="282" y2="300" stroke="url(#goldDark)" stroke-width="2"/>
  </g>
</svg>
