<!doctype html>
<!--
  Sands of Kemet - Google sign-in (GitHub Pages). Two ways in:
   * from the website ("Sign in" on the handbook): signs in and returns to the
     home page, which shows the player's profile. Signing in the first time
     creates the account (registration).
   * from the game (?link=XXXXXXXX): signs in and hands the session to the game
     with complete_login() (backend/supabase/migrations/0002_login_links.sql),
     then forgets it in this browser.
  The two keep their sessions under different storage keys, so a game sign-in
  never touches the website's (and vice versa).
  SUPABASE_URL / SUPABASE_ANON_KEY are filled in by tools/online/publish_pages.sh.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-xnmDR7QmnEPS9UECsVJ6QIAB6ucUnNGgt0SQeZH3xRo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://vkzlypxdbswlvotkcduw.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Sands of Kemet</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: linear-gradient(rgba(11,9,6,.72), rgba(11,9,6,.95)), url(../img/world/heroes_banner.webp) center/cover, #0b0906;
         color: #c9d2e0; font: 17px/1.5 Marcellus, Georgia, serif; text-align: center; }
  .card { width: 100%; max-width: 400px; padding: 32px 28px 24px; border: 1px solid #8c7038; border-radius: 12px;
          background: rgba(13,20,38,.96); box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  .brand { display: block; color: #ffd966; font: 700 15px Cinzel, Georgia, serif; letter-spacing: 3px; text-transform: uppercase; }
  .brand img { display: block; width: 44px; height: 44px; margin: 0 auto 10px; }
  .brand::after { content: ""; display: block; width: 56px; height: 1px; margin: 16px auto 0; background: #8c7038; }
  h1 { color: #f1e6c8; font: 700 23px/1.25 Cinzel, Georgia, serif; margin: 20px 0 8px; }
  p { margin: 0; }
  #msg { color: #aeb8c8; }
  #msg:empty { display: none; }
  .code { margin: 18px 0 2px; padding: 12px 8px; border: 1px dashed #8c7038; border-radius: 8px; background: rgba(255,217,102,.06);
          color: #ffd966; font: 700 30px/1.2 Cinzel, Georgia, serif; letter-spacing: 4px; }
  .google { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 48px; margin-top: 20px; padding: 10px 16px;
            color: #1f1f1f; background: #fff; border: 1px solid #747775; border-radius: 8px; font: 500 16px/1.3 Roboto, Arial, sans-serif; cursor: pointer; }
  .google:hover { background: #f2f2f2; }
  .google:disabled { opacity: .6; cursor: default; }
  .google:focus-visible, a:focus-visible, .btn:focus-visible { outline: 2px solid #ffd966; outline-offset: 2px; }
  .google svg { flex: none; width: 20px; height: 20px; }
  .btn { display: inline-block; margin-top: 20px; padding: 11px 22px; color: #ffd966; background: #121b2c; border: 1px solid #d9a640; border-radius: 8px; text-decoration: none; }
  .small { margin-top: 16px; color: #8a93a3; font-size: 14px; }
  .warn { margin-top: 16px; color: #e8a87c; font-size: 14px; }
  .small a, .legal a { color: #e6c170; }
  .legal { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(140,112,56,.35); color: #8a93a3; font-size: 13px; }
  .tick { width: 52px; height: 52px; margin: 20px auto -6px; border: 2px solid #6fbf73; border-radius: 50%; color: #6fbf73; font: 700 26px/48px Georgia, serif; }
  .spin { width: 28px; height: 28px; margin: 22px auto 4px; border: 3px solid rgba(255,217,102,.2); border-top-color: #ffd966; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  @media (max-width: 380px) { .card { padding: 26px 20px 20px; } .code { font-size: 26px; letter-spacing: 3px; } }
</style>
</head>
<body>
<main class="card">
  <span class="brand"><img src="../favicon.svg" alt="">Sands of Kemet</span>
  <div id="view" aria-live="polite"><div class="spin"></div></div>
</main>
<script src="../vendor/supabase-js-2.117.2.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script>
const SUPABASE_URL = "https://vkzlypxdbswlvotkcduw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZremx5cHhkYnN3bHZvdGtjZHV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2OTgwMzIsImV4cCI6MjEwNjI3NDAzMn0.hq5cs1fM7xt58EkTM3GcRfyg_n6Of42u9kPvxrpGl3Q";
const HOME = new URL("../", location.href).href;

const params = new URLSearchParams(location.search);
// ?next=join/ (the Join page): come back there after signing in instead of the profile.
if (/^[a-z]+\/$/.test(params.get("next") || "")) sessionStorage.setItem("kemet_next", params.get("next"));
function afterSignIn() {
  const next = sessionStorage.getItem("kemet_next");
  sessionStorage.removeItem("kemet_next");
  return next ? HOME + next : HOME + "#profile";
}
if (params.get("link")) sessionStorage.setItem("kemet_link", params.get("link"));
const link = sessionStorage.getItem("kemet_link") || "";
const fromGame = link !== "";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth: {
  flowType: "pkce", detectSessionInUrl: false, autoRefreshToken: !fromGame,
  storageKey: fromGame ? "kemet-game-link" : "kemet-web", persistSession: true}});
const view = document.getElementById("view");

function add(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  view.appendChild(node);
  return node;
}
// One screen of the page: a heading and a line of text. Pieces are added after it.
function screen(title, text) {
  view.replaceChildren();
  add("h1", "", title);
  add("p", "", text).id = "msg";
}
function retry() {
  const again = add("a", "btn", "Try again");
  again.href = "./";
}

const GOOGLE_LOGO = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.7 1.2 9.2 3.6l6.9-6.9C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.3l8 6.2C12.5 13.7 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.9 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.9c-.6 3-2.3 5.5-4.8 7.2l7.8 6c4.5-4.2 7-10.3 7-17.7z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-8-6.2C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.9l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.8-6c-2.2 1.5-4.9 2.3-8.1 2.3-6.2 0-11.5-4.2-13.4-9.8l-8 6.2C6.5 42.6 14.6 48 24 48z"/></svg>';

function googleButton() {
  const button = add("button", "google");
  button.type = "button";
  button.innerHTML = GOOGLE_LOGO + "<span>Continue with Google</span>";
  button.onclick = async () => {
    button.disabled = true;
    const {error} = await client.auth.signInWithOAuth({provider: "google", options: {
      redirectTo: location.origin + location.pathname, queryParams: {prompt: "select_account"}}});
    if (error) { button.disabled = false; document.getElementById("msg").textContent = "Google sign-in could not start. Check your connection and try again."; }
  };
}

function legal() {
  const line = add("p", "legal");
  line.innerHTML = 'By continuing you agree to the <a href="../terms/">Terms</a> and <a href="../privacy/">Privacy Policy</a>.';
}

async function finishGame(session) {
  const {error} = await client.rpc("complete_login", {
    p_link: link, p_access_token: session.access_token,
    p_refresh_token: session.refresh_token, p_expires_in: session.expires_in});
  sessionStorage.removeItem("kemet_link");
  // Forget the game's session in this browser WITHOUT signing out: signOut()
  // ends the session on the server, and the game is now using it.
  for (const key of Object.keys(localStorage)) {
    if (key.startsWith("kemet-game-link")) localStorage.removeItem(key);
  }
  history.replaceState(null, "", location.pathname);
  if (error) { screen("This sign-in has expired", "Go back to the game and tap Sign in again."); return; }
  view.replaceChildren();
  add("div", "tick", "✓");
  add("h1", "", "You're signed in");
  add("p", "", session.user.email || "");
  add("p", "small", "You can close this page and go back to the game.");
}

async function main() {
  if (params.get("error")) {
    // The link stays: Try again returns to the code screen while the game is still waiting.
    screen("Sign-in was cancelled", params.get("error_description") || "Google did not finish the sign-in.");
    retry();
    return;
  }
  if (params.get("code")) {
    const {data, error} = await client.auth.exchangeCodeForSession(params.get("code"));
    if (error || !data.session) { screen("Sign-in did not finish", error ? error.message : "Please try again."); retry(); return; }
    if (fromGame) return finishGame(data.session);
    location.replace(afterSignIn());
    return;
  }
  if (fromGame) {
    if (!/^[A-Z2-9]{8}$/.test(link)) { sessionStorage.removeItem("kemet_link"); screen("This sign-in link is not valid", "Go back to the game and tap Sign in again."); return; }
    // Never straight on to Google: whoever made this link gets the account it
    // signs in. The player checks the code against their own game first.
    screen("Confirm your sign-in", "Check that your game shows this code:");
    add("div", "code", link.slice(0, 4) + "-" + link.slice(4));
    googleButton();
    add("p", "warn", "Different code, or did someone send you this link? Close this page. Continuing would give them your account.");
    const cancel = add("a", "", "Cancel");
    cancel.href = "../";
    cancel.onclick = () => sessionStorage.removeItem("kemet_link");
    add("p", "small").appendChild(cancel);
    legal();
    return;
  }
  // From the website: already signed in? Straight to the profile.
  const {data} = await client.auth.getSession();
  if (data.session) { location.replace(afterSignIn()); return; }
  screen("Sign in", "New here? Your account is created the first time you sign in. It holds your three online characters.");
  googleButton();
  const back = add("a", "", "Back to Sands of Kemet");
  back.href = "../";
  add("p", "small").appendChild(back);
  legal();
}
main();
</script>
<script src="../stats.js" data-kemet-stats data-page="login" data-url="https://vkzlypxdbswlvotkcduw.supabase.co" data-key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZremx5cHhkYnN3bHZvdGtjZHV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2OTgwMzIsImV4cCI6MjEwNjI3NDAzMn0.hq5cs1fM7xt58EkTM3GcRfyg_n6Of42u9kPvxrpGl3Q" defer></script>
</body>
</html>
